<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swing.Lab · 비주얼 시안 H1 / H2 / E1</title>
<style>
:root { --graphite:#111610; --graphite-2:#1b2319; --graphite-3:#293427; --text:#f3f7ed; --steel:#b0baaa; --copper:#c5f26b; --teal:#73dacc; --clear:transparent; color-scheme:dark; }
* { box-sizing:border-box; }
body { margin:0; background:var(--graphite); color:var(--text); font:16px/1.6 system-ui,sans-serif; }
header { max-width:1100px; margin:auto; padding:32px 24px 24px; }
h1 { margin:0 0 8px; font-size:28px; letter-spacing:-.04em; }
p { margin:0; color:var(--steel); }
a { color:var(--teal); }
main { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); }
.theme { min-width:0; padding:24px; background:var(--graphite); color:var(--text); }
.light { --graphite:#f6f8ef; --graphite-2:#fff; --graphite-3:#e7edde; --text:#1b2417; --steel:#526047; --copper:#416500; --teal:#006b61; color-scheme:light; }
h2 { margin:0 0 20px; color:var(--copper); font-size:16px; }
figure { margin:0 auto 28px; max-width:480px; }
figcaption { margin-bottom:10px; font-weight:700; }
.panel { position:relative; border:1px solid var(--graphite-3); background:var(--graphite-2); border-radius:20px; aspect-ratio:4/3; padding:20px 18px 54px; min-width:0; }
.panel img { display:block; width:100%; height:100%; object-fit:contain; }
.panel::before { content:""; position:absolute; inset:10px auto auto 10px; width:18px; height:18px; border-top:2px solid var(--copper); border-left:2px solid var(--copper); }
.readout { position:absolute; bottom:16px; left:16px; right:16px; display:flex; flex-wrap:wrap; justify-content:space-between; gap:4px 8px; color:var(--teal); font:10px/1.5 ui-monospace,monospace; }
.note { margin-top:8px; font-size:13px; }
.empty { display:flex; flex-wrap:wrap; justify-content:center; gap:24px; border:1px solid var(--graphite-3); border-radius:20px; padding:16px; background:var(--graphite-2); text-align:center; }
.empty div { display:flex; flex-direction:column; align-items:center; justify-content:flex-end; }
.empty img { display:block; max-width:100%; height:auto; object-fit:contain; }
.empty span { color:var(--steel); font-size:12px; }
footer { padding:16px 24px 32px; font-size:13px; color:var(--steel); }
@media(max-width:760px) { main { grid-template-columns:minmax(0,1fr); } .theme { padding:20px; } .panel { aspect-ratio:auto; height:270px; } h1 { font-size:24px; } }
</style>
</head>
<body>
<header>
<h1>Swing.Lab · 비주얼 시안</h1>
<p>H1 · H2 중 첫 화면 그림 선택 / E1 공용 빈 상태 그림</p>
<p>1단계 비교 자료 · 앱 미적용 · <a href="../visual-plan.md">배치 계획</a> · <a href="prompts.md">생성 프롬프트 원문</a></p>
</header>
<main>
<section class="theme" aria-label="다크 테마 시안">
<h2>DARK · Club Lime</h2>
<figure>
<figcaption>H1 · 입체 스포츠 일러스트 · 추천</figcaption>
<div class="panel"><img src="H1-sculpted-swing.png" width="1448" height="1086" alt="라임과 민트 관절 표시가 있는 익명의 골퍼 백스윙 일러스트">
<div class="readout"><span>SPINE 29.4°</span><span>SHOULDER 64.2°</span><span>FRAME 0187/0266</span></div></div>
<p class="note">계측 문구는 현재 Hero의 HTML 예시이며 그림에서 측정한 값이 아닙니다.</p>
</figure>
<figure>
<figcaption>H2 · 면과 궤적 중심의 에디토리얼 일러스트</figcaption>
<div class="panel"><img src="H2-editorial-swing.png" width="1448" height="1086" alt="라임과 민트 관절 표시가 있는 익명의 골퍼 다운스윙 일러스트" loading="lazy">
<div class="readout"><span>SPINE 29.4°</span><span>SHOULDER 64.2°</span><span>FRAME 0187/0266</span></div></div>
</figure>
<figure>
<figcaption>E1 · 첫 스윙을 기다리는 영상</figcaption>
<div class="empty"><div><img src="E1-first-swing.png" width="160" height="160" alt="" aria-hidden="true" loading="lazy"><span>업로드 · 160px</span></div><div><img src="E1-first-swing.png" width="120" height="120" alt="" aria-hidden="true" loading="lazy"><span>기록 없음 · 120px</span></div></div>
</figure>
</section>
<section class="theme light" aria-label="라이트 테마 시안">
<h2>LIGHT · Club Lime</h2>
<figure>
<figcaption>H1 · 입체 스포츠 일러스트 · 추천</figcaption>
<div class="panel"><img src="H1-sculpted-swing.png" width="1448" height="1086" alt="라임과 민트 관절 표시가 있는 익명의 골퍼 백스윙 일러스트">
<div class="readout"><span>SPINE 29.4°</span><span>SHOULDER 64.2°</span><span>FRAME 0187/0266</span></div></div>
<p class="note">동일한 투명 PNG를 사용하며 배경과 HTML 계측 문구만 테마에 맞춥니다.</p>
</figure>
<figure>
<figcaption>H2 · 면과 궤적 중심의 에디토리얼 일러스트</figcaption>
<div class="panel"><img src="H2-editorial-swing.png" width="1448" height="1086" alt="라임과 민트 관절 표시가 있는 익명의 골퍼 다운스윙 일러스트" loading="lazy">
<div class="readout"><span>SPINE 29.4°</span><span>SHOULDER 64.2°</span><span>FRAME 0187/0266</span></div></div>
</figure>
<figure>
<figcaption>E1 · 첫 스윙을 기다리는 영상</figcaption>
<div class="empty"><div><img src="E1-first-swing.png" width="160" height="160" alt="" aria-hidden="true" loading="lazy"><span>업로드 · 160px</span></div><div><img src="E1-first-swing.png" width="120" height="120" alt="" aria-hidden="true" loading="lazy"><span>기록 없음 · 120px</span></div></div>
</figure>
</section>
</main>
<footer>생성 PNG 원본 그대로 표시 · 그림은 장식용 개념 시안 · 실제 앱의 반응형·접근성 검증을 대신하지 않습니다.</footer>
</body>
</html>
