server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 라우팅 — 알 수 없는 경로는 index.html로
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 정적 자산 캐시 (해시 파일명이라 장기 캐시 안전)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
